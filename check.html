<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>入口網站 檔案檢查（2.6.1）</title>
<style>
body{font:15px/1.7 system-ui,"Noto Sans TC","Hiragino Sans",sans-serif;margin:0;background:#f4faf7;color:#25332e}
main{max-width:760px;margin:0 auto;padding:24px 18px 60px}
h1{font-size:22px;margin:0 0 4px}
p.s{margin:0 0 18px;color:#5d6b66}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
td,th{padding:9px 12px;border-bottom:1px solid #e3eee9;text-align:left;vertical-align:top}
th{background:#e7f4ee;font-size:13px}
.ok{color:#17805f;font-weight:800}.ng{color:#c0392b;font-weight:800}.wt{color:#8a8a8a}
code{background:#eef5f2;padding:1px 6px;border-radius:6px;font-size:13px}
#sum{margin:18px 0;padding:12px 16px;border-radius:14px;background:#fff;border:1px solid #cfe5db}
</style></head><body><main>
<h1>入口網站 檔案檢查</h1>
<p class="s">確認網站上實際放的檔案是不是 2.6.x 新版。這一頁不會改任何東西。把整個畫面（或下面的 ✖ 項目）告訴人家就好。</p>
<div id="sum">檢查中…</div>
<table><thead><tr><th>項目</th><th>結果</th><th>說明</th></tr></thead><tbody id="rows"></tbody></table>
<p class="s" style="margin-top:16px">如果全部都是 ✔，但網站頁面還是舊的：在該頁面按 <code>Ctrl + F5</code>（Mac：<code>Cmd + Shift + R</code>）強制重新整理；GitHub Pages 更新後也可能要等 1～2 分鐘。</p>
<script>
(function(){
  var rows=document.getElementById('rows'),bad=0,done=0,total=0;
  function add(name,ok,msg){done++;if(!ok)bad++;var tr=document.createElement('tr');
    tr.innerHTML='<td></td><td class="'+(ok?'ok':'ng')+'">'+(ok?'✔':'✖')+'</td><td></td>';
    tr.children[0].textContent=name;tr.children[2].textContent=msg;rows.appendChild(tr);
    document.getElementById('sum').textContent=(done<total?'檢查中…（'+done+'/'+total+'）':(bad?('有 '+bad+' 項不是新版／讀不到，請看下面的 ✖'):'全部都是新版 ✔'));}
  function get(u){return fetch(u+(u.indexOf('?')<0?'?':'&')+'_='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.text();});}
  var T=[
    ['sights.html 載入的版本（?v=）',function(){return get('sights.html').then(function(t){var m=t.match(/pages2\.js\?v=([0-9.]+)/);return m?[/^2\.6\./.test(m[1]),'sights.html 引用 pages2.js?v='+m[1]+(/^2\.6\./.test(m[1])?'':'（應為 2.6.x：這個 html 還是舊的，請重新上傳 *.html）')]:[false,'讀不到版本']});}],
    ['booking.html 載入的版本（?v=）',function(){return get('booking.html').then(function(t){var m=t.match(/booking\.js\?v=([0-9.]+)/);return m?[/^2\.6\./.test(m[1]),'booking.html 引用 booking.js?v='+m[1]]:[false,'讀不到版本']});}],
    ['monorail.html（光瀨市交通局）',function(){return get('monorail.html').then(function(t){var o=t.indexOf('mbPanels')>=0;return [o,o?'單軌獨立頁面已上傳':'沒有 monorail.html，請上傳'];});}],
    ['assets/js/monorail.js（單軌頁程式）',function(){return get('assets/js/monorail.js').then(function(t){var o=t.indexOf('monoOf')>=0;return [o,o?'已上傳':'沒有 assets/js/monorail.js，請上傳'];});}],
    ['assets/css/monorail.css（單軌頁樣式）',function(){return get('assets/css/monorail.css').then(function(t){var o=t.indexOf('mb-tabs')>=0;return [o,o?'已上傳':'沒有 assets/css/monorail.css，請上傳'];});}],
    ['assets/img/monorail/hero.jpg（車両照片）',function(){return get('assets/img/monorail/hero.jpg').then(function(t){return [t.length>1000,t.length>1000?'2.6.1 的新照片已上傳（hero／front／cityscape／viaduct／town）':'沒有新照片，請上傳 assets/img/monorail/ 整個資料夾'];});}],
    ['assets/img/monorail/mark.png（局徽）',function(){return get('assets/img/monorail/mark.png').then(function(t){return [t.length>500,t.length>500?'局徽已上傳（mark.png／mark-s.png）':'沒有局徽，請上傳 assets/img/monorail/ 整個資料夾'];});}],
    ['assets/js/i18n-dict.js（交通局頁的日英翻譯）',function(){return get('assets/js/i18n-dict.js').then(function(t){var o=t.indexOf('快速索引')>=0&&t.indexOf('乘車券案內')>=0;return [o,o?'已含 2.6.0 的交通局頁字典（日／英）':'舊檔：交通局頁在日文／英文會留在中文，請重新上傳 assets/js/i18n-dict.js'];});}],
    ['assets/js/hk-core.js（單軌均一票價＋查詢規則）',function(){return get('assets/js/hk-core.js').then(function(t){var o=t.indexOf('monoOnlyIds')>=0&&t.indexOf('monoFlatFare')>=0;return [o,o?'已含 2.6.0 的單軌均一票價與「起訖都是鉄道站就不出現單軌」的規則':'舊檔：請重新上傳 assets/js/hk-core.js'];});}],
    ['assets/js/booking.js（優惠票券含單軌）',function(){return get('assets/js/booking.js').then(function(t){var o=t.indexOf('Monorail unlimited')>=0;return [o,o?'票券上已加上「光瀨都市單軌　乗り放題」':'舊檔：票券還沒有單軌無限搭乘，請重新上傳 assets/js/booking.js'];});}],
    ['data/snapshot.json（有沒有單軌路線）',function(){return get('data/snapshot.json').then(function(t){var m=t.match(/LIGHT_RAIL/g);var n=m?m.length:0;return [true,n?('快照裡有 '+n+' 筆 LIGHT_RAIL 路線，交通局頁面會顯示它們'):'快照裡還沒有 LIGHT_RAIL 路線——交通局頁面會顯示空狀態，等匯出新快照就會有資料'];});}],
    ['assets/js/hk-map.js（新排版 v3）',function(){return get('assets/js/hk-map.js').then(function(t){var o=t.indexOf('bestV3')>=0&&t.indexOf('v3Hill')>=0;return [o,o?'已含 2.4.0 的新排版（相對位置保持、站外轉乘錨定）':'舊檔：沒有新排版，請重新上傳 assets/js/hk-map.js'];});}],
    ['assets/js/hk-ui.js（轉角圓角＋站名避讓）',function(){return get('assets/js/hk-ui.js').then(function(t){var o=t.indexOf('roundPath')>=0&&t.indexOf('overlapPad')>=0;return [o,o?'已含 2.4.0 的圓角轉彎與站名避讓':'舊檔：沒有圓角／站名避讓，請重新上傳 assets/js/hk-ui.js'];});}],
    ['assets/js/site-config.js（地圖設定）',function(){return get('assets/js/site-config.js').then(function(t){var m=t.match(/mapAlgo:\s*'(\w+)'/);var r=t.match(/mapCornerRadius:\s*(\d+)/);return [!!m,m?('排版＝'+m[1]+'、圓角半徑＝'+(r?r[1]:'?')+'px'):'舊檔：沒有 mapAlgo 設定，請重新上傳 assets/js/site-config.js'];});}],
    ['assets/js/hk-ui.js（輕軌：路線圖畫法）',function(){return get('assets/js/hk-ui.js').then(function(t){var o=t.indexOf('isLrtEdge')>=0&&t.indexOf('--lrt-color')>=0;return [o,o?'已含 2.3.0 的輕軌畫法':'舊檔：沒有輕軌畫法，請重新上傳 assets/js/hk-ui.js'];});}],
    ['assets/js/hk-core.js（輕軌：路線判定）',function(){return get('assets/js/hk-core.js').then(function(t){var o=t.indexOf('LIGHT_RAIL')>=0&&t.indexOf('isLrtEdge')>=0;return [o,o?'已含 2.3.0 的輕軌判定（LIGHT_RAIL）':'舊檔：沒有輕軌判定，請重新上傳 assets/js/hk-core.js'];});}],
    ['assets/css/site.css（輕軌：藍色細線）',function(){return get('assets/css/site.css').then(function(t){var o=t.indexOf('.e-line.lrt')>=0;return [o,o?'已含 2.3.0 的輕軌線條樣式':'舊檔：沒有輕軌樣式，請重新上傳 assets/css/site.css'];});}],
    ['data/snapshot.json（有沒有輕軌路線）',function(){return get('data/snapshot.json').then(function(t){var m=t.match(/LIGHT_RAIL/g);var n=m?m.length:0;return [true,n?('快照裡有 '+n+' 筆 LIGHT_RAIL 路線（上下行各算一筆）'):'快照裡還沒有 LIGHT_RAIL 路線——遊戲裡把路線類型改成「輕軌」再匯出就會變藍色細線'];});}],
    ['assets/js/pages2.js（地方篩選程式）',function(){return get('assets/js/pages2.js').then(function(t){var o=t.indexOf('areaBar')>=0;return [o,o?'有地方篩選程式':'這是舊版 pages2.js，請重新上傳 assets/js/pages2.js']});}],
    ['assets/js/booking.js（地區周遊券・訂購流程）',function(){return get('assets/js/booking.js').then(function(t){var o=t.indexOf("id: 'kt3'")>=0&&t.indexOf('PICKUP')>=0;return [o,o?'有兩款地區周遊券與統一訂購流程':'這是舊版 booking.js，請重新上傳 assets/js/booking.js']});}],
    ['assets/js/i18n-dict.js（新翻譯）',function(){return get('assets/js/i18n-dict.js').then(function(t){var o=t.indexOf('全部行政區')>=0;return [o,o?'有 2.2.x 的新翻譯':'這是舊版字典，請重新上傳 assets/js/i18n-dict.js']});}],
    ['assets/css/mint.css（篩選樣式）',function(){return get('assets/css/mint.css').then(function(t){var o=t.indexOf('.afilter')>=0;return [o,o?'有篩選樣式':'這是舊版 mint.css']});}],
    ['data/areas.json（地方・行政區）',function(){return get('data/areas.json').then(function(t){var j=JSON.parse(t);var o=j.regions&&j.regions.length===6&&j.districts&&j.districts.length>=16;return [o,'地方 '+(j.regions||[]).length+' 個、行政區 '+(j.districts||[]).length+' 個、車站 '+Object.keys(j.stations||{}).length+' 站']}).catch(function(e){return [false,'讀不到（'+e.message+'）：請上傳新增的 data/areas.json']});}],
    ['data/dining.json（餐廳 142 間）',function(){return get('data/dining.json').then(function(t){var j=JSON.parse(t);var n=(j.items||j.list||j.restaurants||[]).length;return [n>=142,'共 '+n+' 間'+(n>=142?'':'（應為 142 間：請重新上傳 data/dining.json）')]}).catch(function(e){return [false,'讀不到（'+e.message+'）']});}],
    ['data/sights.json（景點住址）',function(){return get('data/sights.json').then(function(t){var j=JSON.parse(t);var n=j.filter(function(d){return d.address}).length;return [n===j.length,j.length+' 個景點中有 '+n+' 個有住址'+(n===j.length?'':'：請重新上傳 data/sights.json')]}).catch(function(e){return [false,'讀不到（'+e.message+'）']});}],
    ['data/snapshot.json（ATOS 回傳的路網）',function(){return get('data/snapshot.json').then(function(t){return [t.length>1000,'存在（'+Math.round(t.length/1024)+' KB）。這個檔案不要用 zip 裡的覆蓋']}).catch(function(e){return [false,'讀不到（'+e.message+'）']});}]
  ];
  total=T.length;
  T.forEach(function(x){x[1]().then(function(r){add(x[0],r[0],r[1]);}).catch(function(e){add(x[0],false,String(e&&e.message||e));});});
})();
</script></main></body></html>
