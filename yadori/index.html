<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YADORI 宿り｜光瀨的住宿預訂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2f5e;--navy2:#123d75;--blue:#1565c0;--blue2:#0d4f9e;--amber:#f6b40e;--ink:#1a1a1a;--sub:#595959;--line:#e2e2e2;--bg:#f5f6f8;
  --green:#0a8a3a;--red:#c62828;--radius:8px;
  --font:"Noto Sans TC","Noto Sans JP","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:#fff;font-size:15px;line-height:1.5}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--navy);color:#fff}
.top .bar{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:baseline;gap:8px;color:#fff;font-weight:700;font-size:24px;letter-spacing:.02em}
.logo:hover{text-decoration:none}.logo i{font-style:normal;color:var(--amber)}.logo small{font-size:12px;font-weight:400;opacity:.8;letter-spacing:.1em}
.top .sp{flex:1}
.top .chip{color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 12px;font-size:14px;background:transparent}
.top .chip:hover{background:rgba(255,255,255,.1);text-decoration:none}
.hero{background:var(--navy);color:#fff;padding:28px 0 56px}
.hero h1{margin:0 0 6px;font-size:clamp(26px,4vw,38px);font-weight:700}
.hero p{margin:0;font-size:18px;opacity:.9}
.search{display:grid;grid-template-columns:2fr 1.1fr 1.1fr 1.3fr auto;gap:4px;background:var(--amber);padding:4px;border-radius:10px;margin-top:-28px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.search.inline{margin-top:16px}
.search label{display:flex;flex-direction:column;background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;color:var(--sub)}
.search select,.search input{border:0;font:inherit;font-size:15px;color:var(--ink);padding:2px 0;background:transparent;outline:none;width:100%}
.search .go{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:0 26px;font-size:18px;font-weight:700}
.search .go:hover{background:var(--blue2)}
.guests{display:flex;gap:8px}
.search .dest{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:20;max-height:420px;overflow:auto;padding:6px 0;color:var(--ink);font-size:14px}
.sg-g{font-size:12px;color:var(--sub);padding:8px 14px 4px;font-weight:700}
.sg-i{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer}
.sg-i:hover,.sg-i.on{background:#eef4fc}
.sg-ic{width:22px;text-align:center}.sg-t{flex:1;display:flex;flex-direction:column;line-height:1.3}.sg-t small{color:var(--sub);font-size:12px}
.sg-n{font-size:12px;color:var(--sub);white-space:nowrap}.sg-empty{padding:10px 14px;color:var(--sub)}
.ph,.gmain{position:relative;display:block}.gmain{height:100%}
.illu{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.near{color:var(--navy2);font-weight:500}
.rthumbs{display:flex;gap:8px;overflow-x:auto;margin:10px 0 0}
.rthumbs figure{margin:0;flex:0 0 180px}.rthumbs img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:6px;display:block}
.rthumbs figcaption{font-size:12px;color:var(--sub);margin-top:2px}
table.rooms .rimg{width:100%;max-width:160px;aspect-ratio:3/2;object-fit:cover;border-radius:4px;display:block;margin-bottom:6px}
main{min-height:60vh}
h2.sec{font-size:22px;margin:36px 0 4px}p.secsub{margin:0 0 16px;color:var(--sub)}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.area{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/3;display:block;color:#fff}
.area img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.area:hover img{transform:scale(1.04)}.area:hover{text-decoration:none}
.area div{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.area b{display:block;font-size:20px}.area span{font-size:13px;opacity:.9}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.hcard{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:#fff;color:var(--ink);display:flex;flex-direction:column}
.hcard:hover{text-decoration:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.hcard img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.hcard .b{padding:10px 12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.hcard .nm{font-weight:700}.hcard .ar{font-size:13px;color:var(--sub)}
.hcard .pr{margin-top:auto;text-align:right;font-size:13px;color:var(--sub)}.hcard .pr b{font-size:18px;color:var(--ink)}
.stars{color:var(--amber);letter-spacing:1px;font-size:14px}
.score{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.score b{background:var(--navy);color:#fff;border-radius:6px 6px 6px 0;padding:3px 7px;font-size:14px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:24px;margin:20px 0 48px}
aside.filters{border:1px solid var(--line);border-radius:var(--radius);align-self:start}
aside h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:16px}
aside fieldset{border:0;border-bottom:1px solid var(--line);margin:0;padding:12px 14px}
aside legend{font-weight:700;font-size:14px;padding:0;margin-bottom:6px;float:left;width:100%}
aside label{display:flex;align-items:center;gap:8px;font-size:14px;padding:3px 0;clear:both}
aside label span{margin-left:auto;color:var(--sub);font-size:12px}
.crumb{font-size:13px;color:var(--sub);margin:14px 0 0}
.reshead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.reshead h1{font-size:22px;margin:0;flex:1}
.sorts{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sorts button{background:#fff;border:0;border-right:1px solid var(--line);padding:8px 12px;font-size:13px}
.sorts button:last-child{border-right:0}.sorts button[aria-pressed="true"]{background:#e8f0fb;color:var(--blue);font-weight:700}
.res{display:grid;grid-template-columns:220px 1fr 190px;gap:16px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.res img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px;display:block}
.res h2{font-size:19px;margin:0 0 2px;color:var(--blue)}.res h2 a{color:inherit}
.res .meta{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:2px}
.res .meta a{font-size:13px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;font-size:12px;padding:1px 6px;color:var(--sub);margin-right:4px}
.ok{color:var(--green);font-size:13px}.warn{color:var(--red);font-size:13px;font-weight:700}
.res .side{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px}
.res .side .score{margin-bottom:auto}
.price{font-size:24px;font-weight:700}.small{font-size:12px;color:var(--sub)}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:10px 16px;font-weight:700;font-size:15px;text-align:center}
.btn:hover{background:var(--blue2);text-decoration:none}.btn.block{display:block;width:100%}
.btn:disabled{background:#9db7da;cursor:not-allowed}
.empty{border:1px dashed var(--line);border-radius:var(--radius);padding:32px;text-align:center;color:var(--sub)}
/* hotel page */
.hhead{display:flex;gap:16px;align-items:flex-start;margin:18px 0 12px}
.hhead h1{margin:0;font-size:26px}.hhead .sp{flex:1}
.hhead .addr{font-size:14px;color:var(--sub)}
.gallery{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.gallery img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius);display:block}
.gallery .main{aspect-ratio:16/9}
.gallery .infobox{border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px}
.facs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.facs span{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px}
.facs span::before{content:"✓ ";color:var(--green)}
table.rooms{width:100%;border-collapse:collapse;margin:8px 0 24px;font-size:14px}
table.rooms th{background:var(--navy2);color:#fff;text-align:left;padding:8px 10px;font-weight:500;border:1px solid var(--navy2)}
table.rooms td{border:1px solid #c9d6ea;padding:10px;vertical-align:top}
table.rooms .rn{font-weight:700;color:var(--blue);font-size:15px}
table.rooms .am{font-size:12px;color:var(--sub);margin-top:4px}
table.rooms .pl{font-size:13px}.pl b{display:block}
table.rooms td.pc{white-space:nowrap;min-width:118px}table.rooms td.pl{min-width:150px}
table.rooms select{font:inherit;padding:4px 6px;border:1px solid #aaa;border-radius:4px}
.reserve{position:sticky;top:12px}
.bookgrid{display:grid;grid-template-columns:320px 1fr;gap:24px;margin:20px 0 48px}
.box{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font-size:17px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:14px;margin-bottom:12px}
.form input,.form select,.form textarea{font:inherit;border:1px solid #999;border-radius:4px;padding:8px 10px}
.notice{background:#fff8e1;border:1px solid #f3d27a;border-radius:6px;padding:10px 12px;font-size:13px}
/* voucher: 憑證用 Noto Sans，像真的單據 */
.voucher{font-family:"Noto Sans JP","Noto Sans TC",sans-serif;border:2px solid var(--navy);border-radius:10px;overflow:hidden;max-width:720px;margin:24px auto}
.voucher .vh{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;white-space:nowrap}
.voucher .vh b{font-size:20px}.voucher .vh .sp{flex:1}
.voucher .code{font-size:22px;letter-spacing:.12em;font-weight:700}
.voucher .vb{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:18px}
.voucher img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:6px}
.voucher dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.voucher dt{color:var(--sub)}.voucher dd{margin:0;font-weight:500}
.voucher .vf{border-top:1px dashed #9aa;padding:10px 18px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between}
footer{background:var(--navy);color:#cfd8e6;font-size:13px;padding:24px 0;margin-top:40px}
@media (max-width:900px){
  .search{grid-template-columns:1fr 1fr}.search .dest{grid-column:1/-1}.search .go{grid-column:1/-1;padding:12px}
  .areas,.cards{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:1fr}aside.filters{order:2}
  .res{grid-template-columns:110px 1fr}.res .side{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between;text-align:left}
  .res .side .score{margin:0}
  .gallery{grid-template-columns:1fr}.bookgrid{grid-template-columns:1fr}
  table.rooms thead{display:none}table.rooms,table.rooms tbody,table.rooms tr,table.rooms td{display:block;width:100%}
  table.rooms tr{border:1px solid #c9d6ea;margin-bottom:10px;border-radius:6px}table.rooms td{border:0;border-bottom:1px solid #eef2f8}
  .voucher .vb{grid-template-columns:1fr}.voucher img{aspect-ratio:16/9}.voucher .code{font-size:18px}
}
@media print{header.top,footer,.noprint{display:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <a class="logo" href="#/">YADORI<i>.</i> <small>宿り</small></a>
  <span class="sp"></span>
  <span class="chip" title="幣別">JPY ¥</span>
  <a class="chip" href="#/mine">我的預訂</a>
</div></header>
<main id="app"></main>
<footer><div class="wrap">YADORI 宿り — 光瀨世界的住宿預訂平台。本站所有住宿、價格與預約皆為光瀨伺服器世界觀中的虛構內容，不會產生任何實際的預約或費用。</div></footer>
<script>
(function () {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const app = $('#app');
  let DB = null;
  const yen = n => '¥ ' + Math.round(n).toLocaleString('ja-JP');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const starStr = n => '★'.repeat(n);
  const scoreLabel = s => s >= 9 ? '好極了' : s >= 8.5 ? '非常好' : s >= 8 ? '很棒' : s >= 7 ? '很好' : '好';
  let PL = null;
  const norm = t => String(t).toLowerCase().replace(/\s+/g, '').replace(/[瀬]/g, '瀨').replace(/蔵/g, '藏').replace(/澤/g, '沢').replace(/萬/g, '万').replace(/温/g, '溫').replace(/旧/g, '舊').replace(/駅|站$/g, '');
  const dName = id => { const d = PL.dis[id]; return d ? d.zh : ''; };
  function indexPlaces() {
    const p = DB.places;
    PL = { dis: {}, reg: {}, st: {}, sg: {} };
    p.districts.forEach(d => PL.dis[d.id] = d);
    p.regions.forEach(r => PL.reg[r.id] = r);
    p.stations.forEach(x => PL.st[x.name] = x);
    p.sights.forEach(x => PL.sg[x.id] = x);
    DB.hotels.forEach(h => { if (!PL.st[h.station]) PL.st[h.station] = { name: h.station, district: h.district, pos: null }; });
  }
  function distTo(h, t) {
    if (!t) return null;
    if (t.type === 's') {
      if (h.station === t.name) return h.dist;
      const m = h.marks.find(m => m.type === 'station' && m.ref === t.name); if (m) return m.dist;
      const st = PL.st[t.name];
      return st && st.pos && h.pos ? Math.round(Math.hypot(st.pos[0] - h.pos[0], st.pos[1] - h.pos[1]) / 10) * 10 : null;
    }
    if (t.type === 'l') {
      const m = h.marks.find(m => m.type === 'sight' && m.ref === t.id); if (m) return m.dist;
      const sg = PL.sg[t.id];
      return sg && sg.pos && h.pos ? Math.round(Math.hypot(sg.pos[0] - h.pos[0], sg.pos[1] - h.pos[1]) / 10) * 10 : null;
    }
    return null;
  }
  const NEAR_ST = 1500, NEAR_SG = 2000;
  function tpoint(t) {
    if (!t) return null;
    if (t.type === 's') return PL.st[t.name] && PL.st[t.name].pos;
    if (t.type === 'l') return PL.sg[t.id] && PL.sg[t.id].pos;
    const ps = Object.values(PL.st).filter(x => x.pos && (t.type === 'd' ? x.district === t.id : t.type === 'r' && PL.dis[x.district] && PL.dis[x.district].region === t.id)).map(x => x.pos);
    if (!ps.length) return null;
    return [ps.reduce((a, p) => a + p[0], 0) / ps.length, ps.reduce((a, p) => a + p[1], 0) / ps.length];
  }
  function nearestFallback(t) {
    const pt = tpoint(t); if (!pt) return null;
    const all = DB.hotels.filter(h => h.pos).map(h => ({ h, d: Math.round(Math.hypot(h.pos[0] - pt[0], h.pos[1] - pt[1]) / 10) * 10 })).sort((a, b) => a.d - b.d);
    const ds = [], pick = [];
    for (const x of all) {
      if (!ds.includes(x.h.district)) { if (ds.length >= 3 || (ds.length && pick.length >= 5)) break; ds.push(x.h.district); }
      if (ds.includes(x.h.district)) pick.push(x);
    }
    const out = all.filter(x => ds.includes(x.h.district));
    return out.length ? { ds, list: out } : null;
  }
  function target(code) {
    if (!code) return null;
    const i = code.indexOf(':'), k = code.slice(0, i), v = code.slice(i + 1);
    if (k === 'd' && PL.dis[v]) return { type: 'd', id: v, label: PL.dis[v].zh };
    if (k === 'r' && PL.reg[v]) return { type: 'r', id: v, label: PL.reg[v].zh };
    if (k === 's' && PL.st[v]) return { type: 's', name: v, label: v + '站' };
    if (k === 'l' && PL.sg[v]) return { type: 'l', id: v, label: PL.sg[v].name };
    if (k === 'k') return { type: 'k', text: v, label: '「' + v + '」' };
    const legacy = DB.hotels.find(h => h.area === code);
    if (legacy) return { type: 'd', id: legacy.district, label: dName(legacy.district) };
    return { type: 'k', text: code, label: '「' + code + '」' };
  }
  function inTarget(h, t) {
    if (!t) return true;
    if (t.type === 'd') return h.district === t.id;
    if (t.type === 'r') return PL.dis[h.district] && PL.dis[h.district].region === t.id;
    if (t.type === 's') { const d = distTo(h, t); return h.station === t.name || (d != null && d <= NEAR_ST); }
    if (t.type === 'l') { const d = distTo(h, t); return h.district === PL.sg[t.id].district || (d != null && d <= NEAR_SG); }
    const q = norm(t.text);
    return [h.name, h.area, h.station, dName(h.district)].some(x => norm(x).includes(q));
  }
  function suggest(text) {
    const q = norm(text); if (!q) return [];
    const hit = s => norm(s).includes(q);
    const cnt = t => DB.hotels.filter(h => inTarget(h, t)).length;
    const out = [];
    const regs = DB.places.regions.filter(r => hit(r.zh) || hit(r.ja)).map(r => ({ g: '地區', code: 'r:' + r.id, t: r.zh, sub: '地方', n: cnt({ type: 'r', id: r.id }) }));
    const dis = DB.places.districts.filter(d => hit(d.zh) || hit(d.ja)).map(d => ({ g: '地區', code: 'd:' + d.id, t: d.zh, sub: PL.reg[d.region] ? PL.reg[d.region].zh : '', n: cnt({ type: 'd', id: d.id }) }));
    out.push(...regs, ...dis);
    out.push(...Object.values(PL.st).filter(x => hit(x.name)).map(x => ({ g: '車站', code: 's:' + x.name, t: x.name + '站', sub: dName(x.district), n: cnt({ type: 's', name: x.name }) })).sort((a, b) => b.n - a.n).slice(0, 5));
    out.push(...DB.places.sights.filter(x => hit(x.name) || hit(x.tag)).map(x => ({ g: '地標・景點', code: 'l:' + x.id, t: x.name, sub: dName(x.district) + '・' + x.station + '站', n: cnt({ type: 'l', id: x.id }) })).slice(0, 5));
    out.push(...DB.hotels.filter(h => hit(h.name)).map(h => ({ g: '住宿', code: 'h:' + h.id, t: h.name, sub: dName(h.district) + '・' + h.area, n: -1 })).slice(0, 5));
    return out;
  }

  /* 日期與固定種子的亂數：同一間房、同一天，每次打開都一樣 */
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const nightsOf = (a, b) => Math.max(0, Math.round((parse(b) - parse(a)) / 86400000));
  function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
  function season(s) {
    const d = parse(s), md = (d.getMonth() + 1) * 100 + d.getDate(), dow = d.getDay();
    let f = 1;
    if (md >= 1220 || md <= 105 || (md >= 720 && md <= 831) || (md >= 429 && md <= 505)) f *= 1.28;
    if (dow === 5 || dow === 6) f *= 1.22;
    return f;
  }
  function nightPrice(room, date) { return Math.round(room.base * season(date) * (0.94 + hash(room.id + date) * 0.16) / 100) * 100; }
  function leftOn(room, date) { const r = hash('stock' + room.id + date); return r < 0.07 ? 0 : Math.max(1, Math.round(room.stock * r)); }
  function quote(room, plan, q) {
    let sum = 0, left = 99;
    for (let i = 0; i < q.nights; i++) { const d = addDays(q.in, i); sum += nightPrice(room, d); left = Math.min(left, leftOn(room, d)); }
    const per = Math.min(room.cap, Math.ceil(q.adults / q.rooms));
    sum += plan.add * per * q.nights;
    return { total: Math.max(0, sum), left };
  }
  function fits(room, q) { return room.cap >= Math.ceil(q.adults / q.rooms); }
  function cheapest(h, q) {
    let best = null;
    for (const r of h.rooms) { if (!fits(r, q)) continue; for (const p of r.plans) { const x = quote(r, p, q); if (x.left >= q.rooms && (!best || x.total < best.total)) best = Object.assign({ room: r, plan: p }, x); } }
    return best;
  }

  /* 網址參數 */
  function defaults() { const t = new Date(); t.setDate(t.getDate() + 7); const a = iso(t); return { in: a, out: addDays(a, 1), adults: 2, rooms: 1 }; }
  function readQ(params) {
    const d = defaults(), q = {
      area: params.get('area') || '', in: params.get('in') || d.in, out: params.get('out') || d.out,
      adults: Math.max(1, +params.get('adults') || d.adults), rooms: Math.max(1, +params.get('rooms') || d.rooms)
    };
    if (nightsOf(q.in, q.out) < 1) q.out = addDays(q.in, 1);
    q.nights = Math.min(14, nightsOf(q.in, q.out));
    return q;
  }
  const qs = (q, extra) => new URLSearchParams(Object.assign({ area: q.area || '', in: q.in, out: q.out, adults: q.adults, rooms: q.rooms }, extra || {})).toString();
  const fmtDate = s => { const d = parse(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日（' + '日一二三四五六'[d.getDay()] + '）'; };

  /* 搜尋列 */
  function searchBar(q, inline) {
    const t = target(q.area), lab = t ? (t.type === 'k' ? t.text : t.label) : '';
    const num = (n, from, to, unit) => Array.from({ length: to - from + 1 }, (_, i) => from + i).map(v => `<option value="${v}"${v === n ? ' selected' : ''}>${v} ${unit}</option>`).join('');
    return `<form class="search${inline ? ' inline' : ''}" id="sf">
      <label class="dest">目的地<input name="dest" type="search" value="${esc(lab)}" placeholder="地區、車站、景點或住宿名稱" autocomplete="off" aria-label="目的地" role="combobox" aria-expanded="false" aria-controls="sugg"><input type="hidden" name="area" value="${esc(q.area)}"><div class="sugg" id="sugg" role="listbox" hidden></div></label>
      <label>入住日期<input type="date" name="in" value="${q.in}" aria-label="入住日期"></label>
      <label>退房日期<input type="date" name="out" value="${q.out}" aria-label="退房日期"></label>
      <label>人數與房間<span class="guests"><select name="adults" aria-label="大人">${num(q.adults, 1, 8, '位大人')}</select><select name="rooms" aria-label="房間數">${num(q.rooms, 1, 4, '間')}</select></span></label>
      <button class="go" type="submit">搜尋</button></form>`;
  }
  function bindSearch(where) {
    const f = $('#sf'); if (!f) return;
    const inp = f.dest, box = $('#sugg'), hid = f.area;
    let items = [], sel = -1;
    const close = () => { box.hidden = true; inp.setAttribute('aria-expanded', 'false'); sel = -1; };
    const render = () => {
      items = suggest(inp.value);
      if (!items.length) { box.innerHTML = inp.value.trim() ? '<div class="sg-empty">找不到符合的地點，按搜尋會用關鍵字找住宿</div>' : ''; box.hidden = !inp.value.trim(); return; }
      let g = '';
      box.innerHTML = items.map((x, i) => (x.g !== g ? `<div class="sg-g">${g = x.g}</div>` : '') + `<div class="sg-i${i === sel ? ' on' : ''}" role="option" data-i="${i}"><span class="sg-ic">${{ '地區': '🗺', '車站': '🚉', '地標・景點': '📍', '住宿': '🏨' }[x.g]}</span><span class="sg-t"><b>${esc(x.t)}</b><small>${esc(x.sub)}</small></span>${x.n > 0 ? `<span class="sg-n">${x.n} 間</span>` : x.n === 0 ? '<span class="sg-n">改找附近</span>' : ''}</div>`).join('');
      box.hidden = false; inp.setAttribute('aria-expanded', 'true');
    };
    const pick = i => {
      const x = items[i]; if (!x) return;
      if (x.code.startsWith('h:')) { const q = readQ(new URLSearchParams(new FormData(f))); go(`#/hotel/${x.code.slice(2)}?${qs(q, { area: '' })}`); return; }
      hid.value = x.code; inp.value = x.t; close();
    };
    inp.addEventListener('input', () => { hid.value = ''; sel = -1; render(); });
    inp.addEventListener('focus', () => { if (inp.value.trim() && !hid.value) render(); });
    inp.addEventListener('keydown', e => {
      if (box.hidden || !items.length) return;
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % items.length; render(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel - 1 + items.length) % items.length; render(); }
      else if (e.key === 'Enter' && sel >= 0) { e.preventDefault(); pick(sel); }
      else if (e.key === 'Escape') close();
    });
    box.addEventListener('mousedown', e => { const el = e.target.closest('[data-i]'); if (el) { e.preventDefault(); pick(+el.dataset.i); } });
    document.addEventListener('click', e => { if (!f.contains(e.target)) close(); });
    f.addEventListener('submit', e => {
      e.preventDefault();
      if (!hid.value && inp.value.trim()) {
        const s = suggest(inp.value);
        if (s.length && s[0].code.startsWith('h:')) { pick(0); return; }
        hid.value = s.length ? s[0].code : 'k:' + inp.value.trim();
      }
      const q = readQ(new URLSearchParams(new FormData(f)));
      go((where === 'hotel' ? cur.split('?')[0] : '#/search') + '?' + qs(Object.assign(q, { area: inp.value.trim() ? hid.value : '' })));
    });
  }

  /* 首頁 */

  /* 搜尋結果 */
  let F = { stars: new Set(), budget: '', fac: new Set(), near: '', sort: 'rec' };
  const FACS = [['大浴場', /大浴場|SPA/], ['含早餐方案', null], ['車站直結', /直結/], ['餐廳', /餐廳|料理/], ['泳池', /泳池/]];
  const BUDGETS = [['', '不限'], ['0-10000', '¥10,000 以下'], ['10000-20000', '¥10,000～20,000'], ['20000-40000', '¥20,000～40,000'], ['40000-999999', '¥40,000 以上']];
  function viewSearch(params) {
    const q = readQ(params);
    const t = target(q.area), near = t && (t.type === 's' || t.type === 'l');
    let base = DB.hotels.filter(h => inTarget(h, t)), fb = null;
    if (!base.length && t && t.type !== 'k') { fb = nearestFallback(t); if (fb) base = fb.list.map(x => x.h); }
    const fbD = fb ? new Map(fb.list.map(x => [x.h.id, x.d])) : null, byD = near || !!fb;
    const rows = base.map(h => ({ h, c: cheapest(h, q), d: fb ? fbD.get(h.id) : near ? distTo(h, t) : null }));
    const sortK = F.touched ? F.sort : byD ? 'dist' : 'rec';
    const per = r => r.c ? r.c.total / q.nights / q.rooms : Infinity;
    let list = rows.filter(({ h, c }) => {
      if (F.stars.size && !F.stars.has(h.stars)) return false;
      if (F.budget) { const [lo, hi] = F.budget.split('-').map(Number); const p = per({ c }); if (!(p >= lo && p < hi)) return false; }
      for (const f of F.fac) { const def = FACS.find(x => x[0] === f); if (def[1] ? !h.fac.some(x => def[1].test(x)) : !h.rooms.some(r => r.plans.some(p => /朝食|早餐/.test(p.name)))) return false; }
      if (F.near && h.dist > +F.near) return false;
      return true;
    });
    const S = { rec: (a, b) => (b.h.score * 10 + b.h.stars * 4 - b.h.dist / 100) - (a.h.score * 10 + a.h.stars * 4 - a.h.dist / 100), price: (a, b) => per(a) - per(b), dist: byD ? (a, b) => (a.d == null ? 1e9 : a.d) - (b.d == null ? 1e9 : b.d) : (a, b) => a.h.dist - b.h.dist, stars: (a, b) => b.h.stars - a.h.stars || b.h.score - a.h.score, score: (a, b) => b.h.score - a.h.score };
    list.sort(S[sortK]);
    const cnt = (fn) => rows.filter(fn).length;
    const sortBtn = (k, t) => `<button type="button" data-sort="${k}" aria-pressed="${sortK === k}">${t}</button>`;
    app.innerHTML = `<div class="wrap">${searchBar(q, true)}
      <p class="crumb"><a href="#/">首頁</a> › ${t ? esc(t.label) : '光瀨全區'} › 搜尋結果</p>
      <div class="layout"><aside class="filters" aria-label="篩選條件"><h3>篩選條件</h3>
        <fieldset><legend>星級</legend>${[5, 4, 3].map(s => `<label><input type="checkbox" data-star="${s}"${F.stars.has(s) ? ' checked' : ''}> <span class="stars" style="margin:0;font-size:14px;color:var(--amber)">${starStr(s)}</span><span>${cnt(r => r.h.stars === s)}</span></label>`).join('')}</fieldset>
        <fieldset><legend>每晚預算（每間）</legend>${BUDGETS.map(([v, t]) => `<label><input type="radio" name="bud" value="${v}"${F.budget === v ? ' checked' : ''}> ${t}</label>`).join('')}</fieldset>
        <fieldset><legend>設施與方案</legend>${FACS.map(([f]) => `<label><input type="checkbox" data-fac="${f}"${F.fac.has(f) ? ' checked' : ''}> ${f}</label>`).join('')}</fieldset>
        <fieldset><legend>距離車站</legend>${[['', '不限'], ['100', '100 公尺以內'], ['300', '300 公尺以內'], ['500', '500 公尺以內']].map(([v, t]) => `<label><input type="radio" name="near" value="${v}"${F.near === v ? ' checked' : ''}> ${t}</label>`).join('')}</fieldset>
      </aside>
      <section><div class="reshead"><h1>${fb ? esc(t.label) + '：沒有住宿，改找附近地區' : (t ? esc(t.label) + '：' : '') + '找到 ' + list.length + ' 間住宿'}</h1>${fb ? `<p class="small" style="flex-basis:100%;order:3;margin:-6px 0 0">${esc(t.label)}沒有可預訂的住宿，以下依距離列出最近的地區：${fb.ds.map(dName).map(esc).join('、')}（共 ${list.length} 間，距離為直線距離估算）</p>` : near ? `<p class="small" style="flex-basis:100%;order:3;margin:-6px 0 0">${t.type === 'l' ? `${esc(dName(PL.sg[t.id].district))}的住宿，以及距離 ${esc(t.label)} ${NEAR_SG / 1000} 公里內的住宿` : `距離 ${esc(t.label)} ${NEAR_ST / 1000} 公里內的住宿`}，距離為直線距離估算</p>` : ''}
        <div class="sorts" role="group" aria-label="排序">${sortBtn('rec', '推薦')}${sortBtn('price', '價格最低')}${sortBtn('dist', byD ? '距' + esc(t.label) + '最近' : '距車站最近')}${sortBtn('stars', '星級')}${sortBtn('score', '評分最高')}</div></div>
        ${list.length ? list.map(({ h, c, d }) => resCard(h, c, q, byD ? { label: t.label, d, ref: fb ? null : t.type === 's' ? t.name : t.id } : null)).join('') : '<div class="empty">沒有符合條件的住宿，試試放寬篩選條件。</div>'}
      </section></div></div>`;
    bindSearch();
    app.querySelectorAll('[data-star]').forEach(el => el.onchange = () => { const s = +el.dataset.star; el.checked ? F.stars.add(s) : F.stars.delete(s); viewSearch(params); });
    app.querySelectorAll('[data-fac]').forEach(el => el.onchange = () => { el.checked ? F.fac.add(el.dataset.fac) : F.fac.delete(el.dataset.fac); viewSearch(params); });
    app.querySelectorAll('input[name=bud]').forEach(el => el.onchange = () => { F.budget = el.value; viewSearch(params); });
    app.querySelectorAll('input[name=near]').forEach(el => el.onchange = () => { F.near = el.value; viewSearch(params); });
    app.querySelectorAll('[data-sort]').forEach(el => el.onclick = () => { F.sort = el.dataset.sort; F.touched = true; viewSearch(params); });
  }
  function resCard(h, c, q, tg) {

        <p style="margin:8px 0 6px"><span class="tag">${h.kind}</span>${c ? `<b style="font-size:14px">${esc(c.room.name)}</b>` : ''}</p>
        ${c ? `<div class="small">${esc(c.room.beds)}・${c.room.size} m²</div>` : ''}

        ${c && c.left <= 3 ? `<div class="warn">這個價格只剩 ${c.left} 間！</div>` : ''}</div>

    $('#go').onclick = () => {
      const pick = sels.filter(s => +s.value).map(s => [s.dataset.room, s.dataset.plan, s.value].join('.')).join(',');
      go(`#/book/${h.id}?${qs(q, { pick })}`);
    };
  }

  /* 訂房 */
  function picks(h, params) {
    return (params.get('pick') || '').split(',').filter(Boolean).map(s => { const [rid, pi, n] = s.split('.'); const r = h.rooms.find(x => x.id === rid); return r && r.plans[+pi] ? { r, p: r.plans[+pi], n: Math.max(1, Math.min(5, +n || 1)) } : null; }).filter(Boolean);
  }
  function viewBook(id, params) {
    const h = DB.hotels.find(x => x.id === id), q = readQ(params); if (!h) return viewHome();
    const ps = picks(h, params); if (!ps.length) { go(`#/hotel/${id}?${qs(q)}`); return; }
    const total = ps.reduce((s, x) => s + quote(x.r, x.p, q).total * x.n, 0);
    app.innerHTML = `<div class="wrap"><p class="crumb"><a href="#/">首頁</a> › <a href="#/hotel/${h.id}?${qs(q)}">${esc(h.name)}</a> › 填寫資料</p>
      <div class="bookgrid"><div>
        <div class="box"><span class="stars">${starStr(h.stars)}</span><h3>${esc(h.name)}</h3><div class="small">${dName(h.district)}・距${h.station}站 ${h.dist} 公尺</div></div>
        <div class="box"><h3>預訂內容</h3><div><b>入住</b> ${fmtDate(q.in)}　${h.ci} 以後</div><div><b>退房</b> ${fmtDate(q.out)}　${h.co} 以前</div><div class="small">共 ${q.nights} 晚・${q.adults} 位大人</div>
          <hr style="border:0;border-top:1px solid var(--line)">${ps.map(x => `<div>${x.n} × ${esc(x.r.name)}<div class="small">${esc(x.p.name)}・${esc(x.p.refund)}</div></div>`).join('')}</div>
        <div class="box" style="background:#eef4fc"><h3>價格</h3><div class="price">${yen(total)}</div><div class="small">含稅費・入住時於櫃台付款（虛構）</div></div>
      </div>
      <form class="box form" id="bf"><h3>填寫住客資料</h3>
        <label>住客姓名<input name="name" required maxlength="40" autocomplete="off" placeholder="例：光瀨 太郎"></label>
        <label>預計抵達時間<select name="eta">${['15:00～16:00', '16:00～18:00', '18:00～20:00', '20:00～22:00', '22:00 以後', '尚未確定'].map(v => `<option>${v}</option>`).join('')}</select></label>
        <label>特殊需求（選填）<textarea name="req" rows="3" maxlength="200" placeholder="例：希望住高樓層"></textarea></label>
        <p class="notice">這是光瀨伺服器世界觀中的虛構預約：不需要付款資料，也不會寄出任何郵件。</p>
        <button class="btn" type="submit">確認預訂</button></form></div></div>`;
    $('#bf').onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const code = (Date.now().toString(36).slice(-4) + Math.floor(hash(h.id + Date.now()) * 1e6).toString(36)).toUpperCase().slice(0, 8);
      const rec = { code, hotel: h.id, in: q.in, out: q.out, adults: q.adults, nights: q.nights, items: ps.map(x => ({ room: x.r.name, plan: x.p.name, refund: x.p.refund, n: x.n })), total, name: String(fd.get('name')).slice(0, 40), eta: fd.get('eta'), req: String(fd.get('req') || '').slice(0, 200), at: new Date().toISOString() };
      const all = loadMine(); all.unshift(rec); saveMine(all);
      go('#/done/' + code);
    };
  }
  const MEM = { mine: [] };
  function loadMine() { try { return JSON.parse(localStorage.getItem('yadori.bookings') || '[]'); } catch (e) { return MEM.mine; } }
  function saveMine(a) { MEM.mine = a; try { localStorage.setItem('yadori.bookings', JSON.stringify(a.slice(0, 30))); } catch (e) { /* 預覽環境不能存就只放記憶體 */ } }
  function voucher(rec) {
    const h = DB.hotels.find(x => x.id === rec.hotel);
    return `<div class="voucher"><div class="vh"><b>YADORI 宿り</b><span>住宿憑證</span><span class="sp"></span><span class="code">${rec.code}</span></div>
      <div class="vb"><img src="${h.thumb}" alt=""><dl>
        <dt>住宿</dt><dd>${esc(h.name)}　${starStr(h.stars)}</dd><dt>地點</dt><dd>${dName(h.district)}・距${h.station}站 ${h.dist} 公尺</dd>
        <dt>入住</dt><dd>${fmtDate(rec.in)}　${h.ci} 以後（預計 ${esc(rec.eta)}）</dd><dt>退房</dt><dd>${fmtDate(rec.out)}　${h.co} 以前</dd>
        <dt>住客</dt><dd>${esc(rec.name)}　大人 ${rec.adults} 位・${rec.nights} 晚</dd>
        <dt>客房</dt><dd>${rec.items.map(x => `${x.n} × ${esc(x.room)}（${esc(x.plan)}）`).join('<br>')}</dd>
        <dt>取消規定</dt><dd>${[...new Set(rec.items.map(x => x.refund))].map(esc).join('／')}</dd>
        ${rec.req ? `<dt>需求</dt><dd>${esc(rec.req)}</dd>` : ''}<dt>金額</dt><dd style="font-size:18px">${yen(rec.total)}（含稅・櫃台付款）</dd></dl></div>
      <div class="vf"><span>請在櫃台出示預約代碼</span><span>光瀨世界觀虛構預約</span></div></div>`;
  }
  function viewDone(code) {
    const rec = loadMine().find(r => r.code === code);
    if (!rec) { app.innerHTML = '<div class="wrap"><p class="empty">找不到這筆預訂。</p></div>'; return; }
    app.innerHTML = `<div class="wrap"><h1 style="margin:24px 0 0;color:var(--green)">✓ 預訂完成！</h1><p class="secsub">預約代碼 <b>${rec.code}</b>，入住時請出示下面的住宿憑證。</p>${voucher(rec)}
      <p class="noprint" style="text-align:center"><button class="btn" id="cp">複製預約代碼</button>　<a href="#/mine">查看我的預訂</a></p></div>`;
    $('#cp').onclick = () => { try { navigator.clipboard.writeText(rec.code).then(() => { $('#cp').textContent = '已複製'; }, () => { $('#cp').textContent = rec.code; }); } catch (e) { $('#cp').textContent = rec.code; } };
  }
  function viewMine() {
    const all = loadMine();
    app.innerHTML = `<div class="wrap"><h2 class="sec">我的預訂</h2>${all.length ? all.map(r => { const h = DB.hotels.find(x => x.id === r.hotel); return `<article class="res" style="grid-template-columns:110px 1fr 190px"><img src="${h.thumb}" alt=""><div><h2><a href="#/done/${r.code}">${esc(h.name)}</a></h2><div class="meta"><span>${fmtDate(r.in)} → ${fmtDate(r.out)}・${r.nights} 晚</span><span>預約代碼 ${r.code}</span></div></div><div class="side"><span class="price" style="font-size:18px">${yen(r.total)}</span><a class="btn" href="#/done/${r.code}">查看憑證</a></div></article>`; }).join('') : '<div class="empty">還沒有預訂。</div>'}</div>`;
  }

  /* 路由：頁內狀態為主（在沙盒裡網址列的 hash 不一定能用），能用時順便同步 location.hash，上一頁也能回去 */
  let cur = location.hash.startsWith('#/') ? location.hash : '#/';
  function go(h) {
    cur = h;
    try { if (location.hash !== h) history.pushState(null, '', h); } catch (e) { /* 沙盒不允許就只換頁內狀態 */ }
    route();
  }
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href^="#/"]');
    if (!a || e.ctrlKey || e.metaKey) return;
    e.preventDefault(); go(a.getAttribute('href'));
  });
  window.addEventListener('popstate', () => { if (location.hash.startsWith('#/')) { cur = location.hash; route(); } });
  function route() {
    const raw = cur.slice(1) || '/', [path, qstr] = raw.split('?'), params = new URLSearchParams(qstr || '');
    const seg = path.split('/').filter(Boolean);
    window.scrollTo(0, 0);
    if (seg[0] === 'search') viewSearch(params);
    else if (seg[0] === 'hotel') viewHotel(seg[1], params);
    else if (seg[0] === 'book') viewBook(seg[1], params);
    else if (seg[0] === 'done') viewDone(seg[1]);
    else if (seg[0] === 'mine') viewMine();
    else viewHome();
  }
  fetch('data/hotels.json').then(r => r.json()).then(d => { DB = d; indexPlaces(); route(); }).catch(() => { app.innerHTML = '<div class="wrap"><p class="empty">住宿資料載入失敗。</p></div>'; });
})();
</script>
</body>
</html>
