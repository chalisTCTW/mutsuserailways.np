<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="description" content="光瀨市交通局　光瀨都市單軌（Hikarise Monorail）的運行情報、時刻表、票價與車站介紹。">
<link rel="icon" type="image/png" href="assets/img/monorail/mark-s.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="assets/css/monorail.css?v=2.9.0">
<link rel="stylesheet" href="assets/css/hikacard.css?v=2.9.0">
<link rel="stylesheet" href="assets/css/bus.css?v=2.10.1">
<script>
/* 文字大小在畫面繪製前先套用，避免閃一下 */
(function(){try{document.documentElement.setAttribute('data-size',localStorage.getItem('mb-size')||'m');}catch(e){}})();
</script>
</head>
<body class="mb-body" data-page="monorail">

<div class="mb-util">
  <div class="mb-wrap">
    <span class="util"><span class="lbl">文字大小</span>
      <button type="button" data-size="s">小</button><button type="button" data-size="m">標準</button><button type="button" data-size="l">大</button>
    </span>
    <span class="sp"></span>
    <span class="util">
      <!-- 語言切換由 i18n.js 注入這裡（日本語／中文／EN） -->
      <div class="util"><div class="wrap"></div></div>
    </span>
  </div>
</div>

<header class="mb-head">
  <div class="mb-wrap">
    <a class="mb-logo" href="monorail.html" data-i18n-off>
      <img src="assets/img/monorail/mark.png" alt="" width="42" height="42">
      <span><b>光瀨市交通局</b><span>HIKARISE CITY TRANSPORTATION BUREAU</span></span>
    </a>
    <a class="back" href="index.html">光瀨都市鉄道 本站 →</a>
  </div>
</header>

<nav class="mb-tabs" aria-label="主要選單">
  <div class="mb-wrap" id="mbTabs" role="tablist"></div>
</nav>

<main class="mb-wrap" id="mbPanels"></main>

<footer class="mb-foot">
  <div class="mb-wrap">
    <span>光瀨市交通局　Hikarise City Transportation Bureau</span>
    <span class="links">
      <a href="index.html">光瀨都市鉄道</a>
      <a href="#guide">乘車指南</a>
      <a href="#fleet">車輛介紹</a>
      <a href="#ic">HIKACARD</a>
    </span>
    <span class="ver" style="margin-left:auto"></span>
  </div>
</footer>

<script src="assets/js/site-config.js?v=2.9.0"></script>
<script src="assets/js/atos-model.js?v=2.9.0"></script>
<script src="assets/js/hk-core.js?v=2.9.0"></script>
<script src="assets/js/hk-ui.js?v=2.9.0"></script>
<script src="assets/js/hikacard.js?v=2.9.0"></script>
<script src="assets/js/bus.js?v=2.10.1"></script>
<script src="assets/js/monorail.js?v=2.10.1"></script>
<script src="assets/js/i18n-dict.js?v=2.10.1"></script>
<script src="assets/js/i18n.js?v=2.9.0"></script>
<script>
(function(){
  try{
    var H=document.documentElement;
    document.querySelectorAll('.mb-util [data-size]').forEach(function(b){
      if(b.dataset.size===(localStorage.getItem('mb-size')||'m'))b.setAttribute('aria-pressed','true');
      b.addEventListener('click',function(){
        H.setAttribute('data-size',b.dataset.size);
        try{localStorage.setItem('mb-size',b.dataset.size);}catch(e){}
        document.querySelectorAll('.mb-util [data-size]').forEach(function(x){
          x.setAttribute('aria-pressed',String(x===b));});
      });
    });
    var c=document.querySelector('.mb-foot .ver'); if(c)c.textContent='Portal v2.10.2';
  }catch(e){}
})();
</script>
</body>
</html>
